name: lean-cbcl

# NFR-510 / NFR-511 / TEST-550 / TEST-551:
#   - run `lake build` to enforce zero errors and zero `sorry` warnings
#     for any theorem marked `verified-by: lean`;
#   - run `scripts/check-axioms.sh` to enforce the NFR-511 axiom
#     allowlist on every CON-510..516 theorem.
#
# Re-run on any change to the Lean tree, the SPEC docs the proofs
# depend on, the audit script, or this workflow itself.
on:
  push:
    branches: [main]
    paths:
      - 'lean-cbcl/**'
      - 'specs/SPEC-002-*'
      - 'specs/SPEC-003-*'
      - 'specs/SPEC-005-*'
      - 'scripts/check-axioms.sh'
      - '.github/workflows/lean.yml'
  pull_request:
    paths:
      - 'lean-cbcl/**'
      - 'specs/SPEC-002-*'
      - 'specs/SPEC-003-*'
      - 'specs/SPEC-005-*'
      - 'scripts/check-axioms.sh'
      - '.github/workflows/lean.yml'

jobs:
  lake-build-and-axiom-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        working-directory: lean-cbcl
        run: |
          lean --version
          lake --version

      - name: lake build (NFR-510 / TEST-550)
        working-directory: lean-cbcl
        run: lake build

      - name: Axiom audit (NFR-511 / TEST-551 / OBS-512)
        run: scripts/check-axioms.sh
