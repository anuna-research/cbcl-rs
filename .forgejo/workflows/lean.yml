name: lean-cbcl

# NFR-510 / NFR-511 / NFR-512 / TEST-517 / TEST-518 / TEST-550 / TEST-551 /
# TEST-552 / OBS-510 / OBS-512:
#   - run `lake build` and reject any `sorry` warning in its output to
#     enforce zero errors and zero `sorry` for theorems marked
#     `verified-by: lean` (NFR-510 / TEST-550 / OBS-510). Lean only emits
#     a warning (exit 0) when a declaration uses `sorry`, so the explicit
#     grep is what makes the gate fatal;
#   - run `lake exe runLinter LeanCbcl` (batteries env-linter) so the
#     library stays lint-clean (docstrings, unused args, simpNF, etc.);
#   - run `scripts/check-axioms.sh` to enforce the NFR-511 axiom
#     allowlist on every CON-510..516 theorem (TEST-551 / OBS-512);
#   - run `scripts/check-verified-by.sh` to enforce REQ-517 / TEST-517:
#     every REQ in SPEC-002 and SPEC-003 must carry a valid
#     `verified-by:` annotation. Without this step a PR that drops or
#     mistypes the line would still pass CI;
#   - run the differential parity tests in
#     `crates/cbcl-core/tests/lean_parity.rs` so a Rust-side regression
#     against any REQ-510..516 theorem fails the PR (REQ-518 / TEST-518 /
#     TEST-552 / NFR-512).
#
# Re-run on any change to the Lean tree, the Rust core that the parity
# tests cross-check, the SPEC docs the proofs depend on, the audit
# scripts, or this workflow itself.
on:
  push:
    branches: [main]
    paths:
      - 'lean-cbcl/**'
      - 'crates/cbcl-core/**'
      - 'crates/cbcl-parser/**'
      - 'test-vectors/state/**'
      - 'test-vectors/state-pre-lvar-bytes.json'
      - 'test-vectors/state-role-root-migration.json'
      - 'scripts/generate-state-byte-baseline.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'specs/SPEC-002-*'
      - 'specs/SPEC-003-*'
      - 'specs/SPEC-005-*'
      - 'specs/SPEC-014-*'
      - 'specs/SPEC-015-*'
      - 'specs/SPEC-019-*'
      - 'specs/SPEC-038-*'
      - 'specs/SPEC-042-*'
      - 'proofs/epp-correspondence/**'
      - 'scripts/check-axioms.sh'
      - 'scripts/check-boundary-canonicalisation-mutations.py'
      - 'scripts/check-verified-by.sh'
      - 'scripts/ci-install-rust.sh'
      - 'scripts/ci-install-lean.sh'
      - 'scripts/test-ci-install-lean.py'
      - 'scripts/ci-lean-cache-key.mjs'
      - 'scripts/test-ci-lean-cache-key.mjs'
      - '.forgejo/workflows/lean.yml'
  pull_request:
    paths:
      - 'lean-cbcl/**'
      - 'crates/cbcl-core/**'
      - 'crates/cbcl-parser/**'
      - 'test-vectors/state/**'
      - 'test-vectors/state-pre-lvar-bytes.json'
      - 'test-vectors/state-role-root-migration.json'
      - 'scripts/generate-state-byte-baseline.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'specs/SPEC-002-*'
      - 'specs/SPEC-003-*'
      - 'specs/SPEC-005-*'
      - 'specs/SPEC-014-*'
      - 'specs/SPEC-015-*'
      - 'specs/SPEC-019-*'
      - 'specs/SPEC-038-*'
      - 'specs/SPEC-042-*'
      - 'proofs/epp-correspondence/**'
      - 'scripts/check-axioms.sh'
      - 'scripts/check-boundary-canonicalisation-mutations.py'
      - 'scripts/check-verified-by.sh'
      - 'scripts/ci-install-rust.sh'
      - 'scripts/ci-install-lean.sh'
      - 'scripts/test-ci-install-lean.py'
      - 'scripts/ci-lean-cache-key.mjs'
      - 'scripts/test-ci-lean-cache-key.mjs'
      - '.forgejo/workflows/lean.yml'

jobs:
  lake-build-and-axiom-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test Lean bootstrap and verified fallback paths
        run: python3 scripts/test-ci-install-lean.py

      # The Forgejo runner can abort between output calculation and cache restore
      # without reporting an action error. Bootstrap directly so an optional cache
      # cannot prevent Lean verification from running.
      - name: Install elan (Lean toolchain manager)
        run: bash scripts/ci-install-lean.sh

      - name: Show toolchain
        working-directory: lean-cbcl
        run: |
          lean --version
          lake --version

      - name: lake build (NFR-510 / TEST-550)
        working-directory: lean-cbcl
        # `sorry` only triggers a Lean warning (exit 0), so a freshly
        # imported theorem containing `sorry` would otherwise slip past
        # the build. Capture combined output and fail if any line
        # mentions a declaration using `sorry`.
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log
          if grep -E "(declaration uses 'sorry'|uses sorry)" build.log; then
            echo "FAIL: lake build emitted a sorry warning (NFR-510)" >&2
            exit 1
          fi

      - name: Install Rust for live projection refinement
        run: bash scripts/ci-install-rust.sh

      - name: Check state corpus and historical render bytes (TEST-3807)
        run: cargo test -p cbcl-parser --test state_corpus

      - name: Compare real Rust projection with kernel-reduced Lean
        run: cargo test -p cbcl-core --test projection_refinement -- --ignored

      - name: Compare native repeat verdicts with kernel-reduced Lean
        run: cargo test -p cbcl-parser --test repeat_execution -- --include-ignored

      - name: Compare native progress state with kernel-reduced Lean
        run: cargo test -p cbcl-parser --test state_progress -- --include-ignored

      - name: Build executable Lean enactability oracle
        working-directory: lean-cbcl
        run: lake build cbcl-enactability-oracle

      - name: Compare native protocol building, acyclicity and causal verification against Lean enactability
        env:
          PROPTEST_RNG_SEED: '390039'
          PROPTEST_CASES: '512'
        run: cargo test -p cbcl-parser --test enactability_oracle -- --ignored

      - name: Build executable Lean state oracle
        working-directory: lean-cbcl
        run: lake build cbcl-state-oracle

      - name: Compare native canonicalisation, kernels, freezes and derived reads against Lean
        env:
          PROPTEST_RNG_SEED: '380038'
          PROPTEST_CASES: '512'
        run: cargo test -p cbcl-parser --test state_kernel_oracle -- --ignored

      - name: Require canonicalisation conformance to catch native mutations
        env:
          PROPTEST_RNG_SEED: '420042'
          PROPTEST_CASES: '32'
        run: python3 scripts/check-boundary-canonicalisation-mutations.py

      - name: Batteries env-linter (keep LeanCbcl lint-clean)
        working-directory: lean-cbcl
        # `lake exe runLinter` (from the batteries dependency) exits
        # non-zero on any finding — missing docstrings, unused arguments,
        # simp-normal-form issues, def/lemma confusion, etc. The library
        # is lint-clean at HEAD; this gate keeps it so. Suppressions must
        # be explicit `@[nolint <linter>]` with an in-source justification
        # (never silence a real issue to make the gate green).
        run: lake exe runLinter LeanCbcl

      - name: Axiom audit (NFR-511 / TEST-551 / OBS-512)
        run: scripts/check-axioms.sh

      - name: verified-by lint (REQ-517 / TEST-517)
        run: scripts/check-verified-by.sh

  lean-parity-tests:
    # REQ-518 / TEST-518 / TEST-552 / NFR-512: the Rust-side property tests
    # in crates/cbcl-core/tests/lean_parity.rs assert the same property as
    # each REQ-510..516 Lean theorem at the value level, so a divergence
    # between the model and the implementation surfaces as a CI failure.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable, per rust-toolchain.toml)
        run: bash scripts/ci-install-rust.sh

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lean-parity-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lean-parity-

      - name: Run Lean parity tests (REQ-518 / TEST-518)
        run: cargo test -p cbcl-core --test lean_parity --release
