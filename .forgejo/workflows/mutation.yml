name: mutation-testing

# Manual full mutation campaign. The maintainer paused automatic PR and weekly
# runs after run 333 exhausted the three-hour job limit. Parser nontermination
# mutants each consumed 385 seconds, and surviving mutants remain coverage work.
# This pause is not a passing mutation result. Keep the score gate intact for
# manual runs; targeted CLOK semantic mutation scripts remain available.
#
# Restore automatic runs after bounding campaign runtime, fixing configuration
# loading and resolving the surviving-mutant coverage gaps.
on:
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test mutation threshold gate
        run: python3 scripts/test-mutation-gate.py

      - name: Install Rust toolchain (stable, per rust-toolchain.toml)
        run: bash scripts/ci-install-rust.sh

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mutants-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mutants-

      - name: Install cargo-mutants
        run: |
          if ! command -v cargo-mutants >/dev/null 2>&1; then
            cargo install cargo-mutants --locked
          fi
          cargo mutants --version

      - name: Run mutation testing (≥ 90% kill rate required)
        run: scripts/run-mutation-tests.sh
