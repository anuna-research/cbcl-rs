name = "lean-cbcl"
version = "0.1.0"
defaultTargets = ["LeanCbcl", "cbcl-parse"]

[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries"
rev = "v4.27.0"

[[lean_lib]]
name = "LeanCbcl"

[[lean_exe]]
name = "cbcl-parse"
root = "Main"

[[lean_exe]]
name = "cbcl-state-oracle"
root = "StateKernelOracle"

[[lean_exe]]
name = "cbcl-flat-contract-oracle"
root = "FlatContractsOracle"

[[lean_exe]]
name = "cbcl-enactability-oracle"
root = "EnactabilityOracle"
