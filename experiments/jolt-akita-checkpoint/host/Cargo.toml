[package]
name = "cbcl-akita-host"
version = "0.0.0"
edition = "2021"
[dependencies]
checkpoint-common = { path = "../common" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
postcard = { version = "1", features = ["use-std"] }
bincode = { version = "2", features = ["serde"] }
common = { path = "../../common", features = ["std"] }
jolt-host = { path = "../../crates/jolt-host" }
jolt-program = { path = "../../crates/jolt-program" }
jolt-prover = { path = "../../crates/jolt-prover", features = ["akita"] }
jolt-verifier = { path = "../../crates/jolt-verifier", features = ["akita"] }
jolt-akita = { path = "../../crates/jolt-akita" }
jolt-transcript = { path = "../../crates/jolt-transcript", features = ["prover-grinding"] }
jolt-witness = { path = "../../crates/jolt-witness" }
tracer = { path = "../../tracer" }
