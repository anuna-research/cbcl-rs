<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690" role="img" aria-label="Stratified admission model: recognised, authenticated and accepted input sets feed the Causal Lattice Observation Kernel (CLOK), comprising lattice interpretation and a read interface for snapshots, thresholds and causal freezes."><rect width="1100" height="690" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#111"/></marker></defs><text x="20" y="34" font-family="Times New Roman" font-size="25" text-anchor="start" fill="#111" font-weight="bold">Stratified admission model</text><rect x="20" y="60" width="650" height="600" rx="3" fill="white" stroke="#555" stroke-width="0.85"/><text x="36" y="91" font-family="Times New Roman" font-size="23" text-anchor="start" fill="#111" font-weight="normal">Σ*</text><text x="76" y="91" font-family="Times New Roman" font-size="18" text-anchor="start" fill="#111" font-weight="normal">all inputs</text><rect x="72" y="132" width="560" height="490" rx="3" fill="white" stroke="#555" stroke-width="0.85" stroke-dasharray="5 4"/><text x="84" y="121" font-family="Times New Roman" font-size="15" text-anchor="start" fill="#333" font-weight="normal">Recognition: complete input under the installed grammar</text><rect x="72" y="132" width="535" height="380" rx="3" fill="#f3f3f3" stroke="#555" stroke-width="0.85"/><text x="86" y="164" font-family="Times New Roman" font-size="23" text-anchor="start" fill="#111" font-weight="normal">L</text><text x="101" y="170" font-family="Times New Roman" font-size="15" text-anchor="start" fill="#111" font-weight="normal">E</text><text x="130" y="164" font-family="Times New Roman" font-size="18" text-anchor="start" fill="#111" font-weight="normal">recognised language</text><text x="130" y="188" font-family="Times New Roman" font-size="16" text-anchor="start" fill="#111" font-weight="normal">deterministic context-free</text><text x="132" y="209" font-family="Times New Roman" font-size="15" text-anchor="start" fill="#333" font-weight="normal">Receipt: content addresses and host authentication</text><rect x="120" y="220" width="438" height="236" rx="3" fill="#e5e5e5" stroke="#555" stroke-width="0.85"/><text x="136" y="251" font-family="Times New Roman" font-size="23" text-anchor="start" fill="#111" font-weight="normal">S</text><text x="161" y="251" font-family="Times New Roman" font-size="18" text-anchor="start" fill="#111" font-weight="normal">authenticated received records</text><text x="182" y="284" font-family="Times New Roman" font-size="15" text-anchor="start" fill="#333" font-weight="normal">Admission: roles and causal evidence</text><rect x="170" y="300" width="355" height="98" rx="3" fill="#ccc" stroke="#555" stroke-width="0.85"/><text x="186" y="331" font-family="Times New Roman" font-size="23" text-anchor="start" fill="#111" font-weight="normal">A</text><text x="213" y="331" font-family="Times New Roman" font-size="18" text-anchor="start" fill="#111" font-weight="normal">accepted acts</text><text x="186" y="359" font-family="Times New Roman" font-size="17" text-anchor="start" fill="#111" font-weight="normal">required predecessors accepted</text><text x="186" y="384" font-family="Times New Roman" font-size="17" text-anchor="start" fill="#111" font-weight="normal">roles and protocol valid</text><text x="136" y="425" font-family="Times New Roman" font-size="15" text-anchor="start" fill="#333" font-weight="normal">Unknown: waiting for evidence</text><text x="136" y="447" font-family="Times New Roman" font-size="15" text-anchor="start" fill="#333" font-weight="normal">Violation: retained in S, excluded from A</text><text x="136" y="488" font-family="Times New Roman" font-size="15" text-anchor="start" fill="#333" font-weight="normal">Unauthenticated inputs do not enter S.</text><text x="86" y="542" font-family="Times New Roman" font-size="16" text-anchor="start" fill="#333" font-weight="normal">Outside the recognised language:</text><text x="86" y="566" font-family="Times New Roman" font-size="16" text-anchor="start" fill="#333" font-weight="normal">rejected before processing.</text><text x="86" y="592" font-family="Times New Roman" font-size="15" text-anchor="start" fill="#333" font-weight="normal">Installing D enlarges recognition;</text><text x="86" y="615" font-family="Times New Roman" font-size="15" text-anchor="start" fill="#333" font-weight="normal">existing declarations are preserved.</text><text x="735" y="153" font-family="Times New Roman" font-size="21" text-anchor="start" fill="#111" font-weight="bold">Causal Lattice</text><text x="735" y="181" font-family="Times New Roman" font-size="21" text-anchor="start" fill="#111" font-weight="bold">Observation Kernel (CLOK)</text><rect x="735" y="205" width="320" height="165" rx="3" fill="#f5f5f5" stroke="#555" stroke-width="0.85"/><text x="752" y="236" font-family="Times New Roman" font-size="21" text-anchor="start" fill="#111" font-weight="bold">Lattice interpretation</text><text x="752" y="278" font-family="Times New Roman" font-size="24" text-anchor="start" fill="#111" font-weight="normal">κ = K</text><text x="809" y="284" font-family="Times New Roman" font-size="15" text-anchor="start" fill="#111" font-weight="normal">D</text><text x="822" y="278" font-family="Times New Roman" font-size="24" text-anchor="start" fill="#111" font-weight="normal">(A)</text><text x="752" y="312" font-family="Times New Roman" font-size="18" text-anchor="start" fill="#111" font-weight="normal">Lattice-valued evidence</text><text x="752" y="339" font-family="Times New Roman" font-size="17" text-anchor="start" fill="#333" font-weight="normal">monotone as accepted</text><text x="752" y="361" font-family="Times New Roman" font-size="17" text-anchor="start" fill="#333" font-weight="normal">evidence grows</text><line x1="525" y1="349" x2="735" y2="349" stroke="#111" stroke-width="1" marker-end="url(#arrow)"/><line x1="895" y1="370" x2="895" y2="430" stroke="#111" stroke-width="1" marker-end="url(#arrow)"/><rect x="735" y="430" width="320" height="200" rx="3" fill="white" stroke="#555" stroke-width="0.85"/><text x="752" y="461" font-family="Times New Roman" font-size="21" text-anchor="start" fill="#111" font-weight="bold">Read interface</text><text x="752" y="500" font-family="Times New Roman" font-size="24" text-anchor="start" fill="#111" font-weight="normal">σ = read</text><text x="834" y="506" font-family="Times New Roman" font-size="15" text-anchor="start" fill="#111" font-weight="normal">D</text><text x="847" y="500" font-family="Times New Roman" font-size="24" text-anchor="start" fill="#111" font-weight="normal">(κ)</text><text x="752" y="537" font-family="Times New Roman" font-size="17" text-anchor="start" fill="#111" font-weight="normal">snapshot: revisable observation</text><text x="752" y="568" font-family="Times New Roman" font-size="17" text-anchor="start" fill="#111" font-weight="normal">threshold: stable success</text><text x="752" y="591" font-family="Times New Roman" font-size="17" text-anchor="start" fill="#111" font-weight="normal">or explicit conflict</text><text x="752" y="619" font-family="Times New Roman" font-size="17" text-anchor="start" fill="#111" font-weight="normal">freeze: exact causal cut</text></svg>