[package]
name = "cbcl-core"
description = "CBCL pure core: types, verification, and serialization"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std"]
std = []
serde = ["dep:serde"]
thiserror = ["dep:thiserror"]
tracing = ["dep:tracing"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }
hashbrown = { version = "0.15", default-features = false, features = ["default-hasher", "inline-more"] }
thiserror = { version = "2", default-features = false, optional = true }
tracing = { workspace = true, optional = true }
# Install-time dialect content hashing (SPEC-014 REQ-628); no_std-compatible.
sha2 = { version = "0.10", default-features = false }

# SPEC-040: Unicode 16.0.0 tables and deterministic no_std Thompson execution.
regex-syntax = { version = "=0.8.11", default-features = false, features = ["unicode"] }
regex-automata = { version = "=0.4.14", default-features = false, features = ["alloc", "syntax", "unicode", "nfa-pikevm"] }
num-bigint = { version = "0.4.6", default-features = false }

[dev-dependencies]
proptest = "1"
criterion.workspace = true

[[bench]]
name = "core_bench"
harness = false

# sha2 0.10 gates AArch64 SHA instructions behind `asm`. Keep its assembler
# dependency out of WASM and other targets; the hash format is unchanged.
[target.'cfg(all(target_arch = "aarch64", target_family = "unix"))'.dependencies]
sha2 = { version = "0.10", default-features = false, features = ["asm"] }
