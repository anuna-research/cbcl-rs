[package]
name = "cbcl-ffi"
description = "CBCL C FFI bindings via cbindgen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
default = ["std"]
std = ["cbcl-core/std", "cbcl-parser/std"]
tracing = ["cbcl-core/tracing", "cbcl-parser/tracing"]

[dependencies]
cbcl-core = { workspace = true, default-features = false }
cbcl-parser = { workspace = true, default-features = false }

[build-dependencies]
cbindgen = "0.27"
