[package]
name = "cbcl-state-proof"
description = "Experimental bounded Halo2 proofs of CBCL admission and state"
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
publish = false

[dependencies]
cbcl-core = { workspace = true, features = ["std"] }
cbcl-parser = { workspace = true, features = ["std"] }
halo2_proofs = "=0.3.5"
ff = "0.13"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
