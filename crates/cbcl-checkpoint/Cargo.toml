[package]
name = "cbcl-checkpoint"
description = "Native CBCL checkpoint certificates, incremental summaries and durable host lifecycle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["std"]
std = ["cbcl-core/std", "cbcl-parser/std", "dep:serde_json", "dep:fs2", "tracing/std"]

[dependencies]
cbcl-core = { workspace = true, features = ["serde"] }
cbcl-parser.workspace = true
serde = { version = "1", default-features = false, features = ["derive", "alloc", "rc"] }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", default-features = false }
tracing.workspace = true
fs2 = { version = "0.4", optional = true }

[dev-dependencies]
ed25519-dalek = "=2.1.1"
rustix = { version = "=1.1.4", features = ["time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
