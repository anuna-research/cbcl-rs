[package]
name = "cbcl-wasm"
description = "CBCL WebAssembly bindings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["std"]
std = ["cbcl-core/std", "cbcl-parser/std"]
bindgen = ["dep:wasm-bindgen"]
tracing = ["cbcl-core/tracing", "cbcl-parser/tracing"]
# SPEC-024 REQ-142 / TEST-018 cross-runtime parity — the MEANINGFUL cross-target
# leg. Exposes the mls-ds/v1 verdict vector-runner as a pure byte export (and,
# with `bindgen`, a JS export). Pulls `cbcl-core/mls-ds-proof`, which forces
# `std` + a real strict Ed25519 verifier (ed25519-dalek v2). Verification needs
# no RNG, so getrandom is never linked and this DOES build for
# wasm32-unknown-unknown (proven). Non-default: the production wasm surface is
# unchanged unless switched on.
mls-ds-proof = ["cbcl-core/mls-ds-proof"]

[dependencies]
cbcl-core = { workspace = true, default-features = false }
cbcl-parser = { workspace = true, default-features = false }
sha2 = { version = "0.10", default-features = false }
wasm-bindgen = { version = "0.2", optional = true }

# Explicit allocator for any `wasm32` cdylib without std. The previous
# WasmAlloc shim recursed into compiler-internal `__rust_alloc` externs
# which are not provided for cdylib targets — leaving the .wasm with
# unresolved imports that crashed any non-JS host. The cfg here matches
# the source-side `cfg(all(target_arch = "wasm32", not(feature = "std"),
# not(feature = "bindgen")))` everywhere Cargo can express it (Cargo
# target cfgs cannot reference features), so wasm32-wasip1 no_std builds
# can resolve `dlmalloc::GlobalDlmalloc` too.
[target.'cfg(target_arch = "wasm32")'.dependencies]
dlmalloc = { version = "0.2", features = ["global"] }

[dev-dependencies]
# SPEC-024 REQ-142 wasm32 parity harness: `wasm-pack test --node` drives the
# `#[wasm_bindgen_test]` corpus case in `tests/mls_ds_parity.rs`.
wasm-bindgen-test = "0.3"
