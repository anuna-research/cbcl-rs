[package]
name = "cbcl-parser"
description = "CBCL pure parser and pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std"]
# The JSON contract compiler (SPEC-087) needs serde_json's preserve_order,
# which needs std; every binding builds with std, the no_std core does not.
std = ["cbcl-core/std", "dep:serde_json", "serde_json/preserve_order"]
serde = ["cbcl-core/serde"]
tracing = ["dep:tracing", "cbcl-core/tracing"]

[dependencies]
cbcl-core.workspace = true
tracing = { workspace = true, optional = true }
# SPEC-087: the JSON authoring contract. `alloc` mode keeps the crate no_std.
serde_json = { version = "1", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
proptest = "1"
serde_json = "1"
cbcl-core = { path = "../cbcl-core", features = ["serde"] }
criterion.workspace = true

[[bench]]
name = "parse_bench"
harness = false
