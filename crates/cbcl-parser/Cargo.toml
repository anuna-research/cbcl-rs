[package]
name = "cbcl-parser"
description = "CBCL pure parser and pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std"]
std = ["cbcl-core/std"]
serde = ["cbcl-core/serde"]
tracing = ["dep:tracing", "cbcl-core/tracing"]

[dependencies]
cbcl-core.workspace = true
tracing = { workspace = true, optional = true }

[dev-dependencies]
proptest = "1"
serde_json = "1"
cbcl-core = { path = "../cbcl-core", features = ["serde"] }
criterion.workspace = true

[[bench]]
name = "parse_bench"
harness = false
