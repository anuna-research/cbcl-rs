[package]
name = "cbcl-arena"
description = "SPEC-011: Multi-agent arena challenge simulator (PSI, Yao's Millionaire, Dining Cryptographers)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[features]
default = []

[dependencies]
cbcl-core = { workspace = true, features = ["std"] }
cbcl-parser = { workspace = true, features = ["std"] }
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"

[dev-dependencies]
proptest = "1"

[[example]]
name = "cbcl-arena"
path = "examples/cli.rs"

[[example]]
name = "glm_psi"
path = "examples/glm_psi.rs"

[[example]]
name = "live_arena"
path = "examples/live_arena.rs"
