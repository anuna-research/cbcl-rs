[package]
name = "cbcl-cli"
description = "CBCL command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
tracing = ["cbcl-core/tracing", "cbcl-parser/tracing"]

[dependencies]
cbcl-core = { workspace = true, features = ["std", "serde"] }
cbcl-parser = { workspace = true, features = ["std", "serde"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
