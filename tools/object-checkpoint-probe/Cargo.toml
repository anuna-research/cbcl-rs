[package]
name = "cbcl-object-checkpoint-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
cbcl-core = { workspace = true, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = "=2.1.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
